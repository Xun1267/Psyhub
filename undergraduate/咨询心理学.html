    <script>
    (function(){
        var target = document.getElementById('note-content');
        var md = `1. 心理咨询师的基本态度
(1) 真诚
(2) 共情
(3) 积极关注
2. 正念训练所提升的三种能力
（1）活在当下的能力
（2）离开头脑的能力
（3）如实经历的能力
3. 心理咨询的基本原则
(1) 保密原则
(2) 助人自助原则
(3) 价值中立原则
4. 心理不健康包括哪三种心理问题
(1) 一般心理问题
(2) 严重心理问题
(3) 神经症性心理问题
5. 中国心理学会工作伦理守则（第二版总则包括哪五个方面）
(1) 善行
(2) 善任
(3) 诚信
(4) 公正
(5) 尊重
6. 理情行为疗法 ABC模型分别代表谁
(1) A (Activating Event)：诱发性事件
(2) B (Belief)：个体对事件的信念
(3) C (Consequence)：情绪和行为后果
7. 心理正常与异常的三个判断原则
(1) 主观世界与客观世界的统一性原则
(2) 心理活动的内在协调性原则
(3) 人格的相对稳定性原则
8. 森田疗法的核心咨询理念
顺应自然、为所当为
9. 沉默的三种类型
(1) 创造性沉默
(2) 自发性沉默
(3) 冲突性沉默
10. 催眠的五个步骤
(1) 沟通
(2) 导入
(3) 加深
(4) 干预
(5) 唤醒
11. 标准认知行为疗法中认知三层次理论所提出的认知三层次是什么
(1) 自动思维
(2) 中间信念
(3) 核心信念
12. 苏格拉底式六问
（1）有什么证据可以证明你的想法是正确的？反面的证据又有哪些？
（2）有没有其他方式来看待这个问题？
（3）最糟糕的结果会怎样？如果真的发生，你该如何应对？最好的结果会怎样？对于这个情境，最现实的结果是什么？
（4）相信你的自动思维会带来什么结果？如果你改变想法又会怎样？
（5）如果你的朋友或家人在这种情况下有同样的自动思维，你会给他什么建议？
（6）你可以做些什么？
13. 接纳承诺疗法中创造性无望的提问流程
(1) 你尝试过用什么方法来摆脱这个感受？
(2) 这些方法的效果怎么样，暂时有效还是长期有效？
(3) 这些方法让你付出了什么代价？
(4)你愿意尝试一种新的方式面对这些感受吗？
14. 一般心理问题，严重心理问题，神经症性心理问题的评估思路
(1) 第一步：排除器质性病变（通过生理检查排除身体疾病引起的心理症状）。
(2) 第二步：区分心理正常与异常（根据心理正常与异常的三原则，排除精神病性障碍）。
(3) 第三步：区分神经症与心理不健康（根据病程、痛苦程度、社会功能受损程度进行评分，区分神经症与神经症性心理问题）。
(4) 第四步：区分一般心理问题与严重心理问题（根据刺激的性质、持续时间、反应是否泛化来区分：持续1-2个月且未泛化为一般；持续2-6个月且已泛化为严重）。
15. 标准认知行为疗法
通过改变个人对己、对人或对事的看法与态度（认知），来改变心理问题（情绪与行为）的一种心理治疗方法。
16. 名词解释
(1) 正念：正念是以一种特定的方式对自己的身心进行觉察，即有意识地觉察、活在当下及不做判断。。
(2) 共情：咨询师站在来访者的角度，设身处地地体验来访者的内心世界，与其感同身受，并准确地表达给来访者
(3) 移情：个体将早年对重要他人的态度、情感、冲动、欲望、行为模式无意识地重现在当前的人际关系之中。移情分为正移情和负移情。
(4) 阻抗：来访者由于在意识层面和无意识层面对咨询进程的抗拒而出现的各种情况。
(5) 精神交互作用：精神交互作用是当症状发生后，患者由于自我暗示，注意力越来越集中于症状，感觉体验就会变得敏感，感觉的过敏使注意力又进一步固定于此感觉（症状），感觉与注意彼此促进、交互作用，从而产生持久症状的一种心理机制。
`;
        var toc = [];
        var mdLines = md.split(/\n+/);
        for (var i = 0; i < mdLines.length; i++) {
            var m = mdLines[i].match(/^Chapter\s+(\d+)\s+(.+)$/i);
            if (m) { toc.push({ num: m[1], title: m[2], id: 'chapter-' + m[1] }); }
        }
        var replaced = md.replace(/^Chapter\s+(\d+)\s+(.+)$/gim, function(_, n, t){ return '<h2 class="chapter-title" id="chapter-' + n + '">Chapter ' + n + ' ' + t + '</h2>'; });
        var lines2 = replaced.split(/\n+/);
        var contentHtml = lines2.map(function(line){
            var t = line.trim();
            if (!t) return '';
            if (t.indexOf('<h2') === 0) return t;
            return '<p>' + t + '</p>';
        }).join('');
        target.innerHTML = contentHtml;
        var tocList = document.getElementById('toc-list');
        tocList.innerHTML = toc.map(function(item){ return '<li><a href="#' + item.id + '">Chapter ' + item.num + ' ' + item.title + '</a></li>'; }).join('');
    })();
    </script>

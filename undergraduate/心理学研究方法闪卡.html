    <script>
        const flashcardData = [
            { question: "心理与教育科学研究的目的", answer: `（1）描述
（2）解释
（3）预测
（4）控制` },
            { question: "心理与教育科学研究的原则", answer: `（1）客观性原则
（2）系统性原则
（3）理论与实践相结合原则
（4）教育性原则
（5）伦理性原则` },
            { question: "心理学研究的特殊性", answer: `（1）研究对象与研究者的特殊性
①研究对象是有意识、有心理学的有机体
②研究对象是社会实体，具有社会性
③研究变量多且复杂，研究难以精确地解释和预测
④研究对象无法精确控制与操纵
⑤人的心理具有发展性
⑥人的心理具有个体差异性
⑦研究者与研究对象都是有意识、有目的的人
（2）研究过程的特殊性
①心理与教育科学研究是主客体相互作用的过程，研究对象根据研究者的要求或实验控制做出反应，研究对象的反应反过来影响研究者的行为。
②研究过程受社会政治背景影响
（3）研究方法的特殊性
①研究要符合伦理性原则
②多数研究方法较难准确描述出脑内心理活动的具体过程与变化` },
            { question: "心理学理论的评价标准", answer: `（1）精确性
（2）可检验性
（3）概括能力
（4）简洁性` },
            { question: "生态化倾向（概念、观点、意义）", answer: `（一）概念
强调在真实、自然的情景中研究人的心理活动规律与教育规律，提高研究外的外部效度、生态效度，提高研究结果在真实的生活、工作、教育实践中的应用性和普通适用性。
（二）观点
①心理活动或教育活动与处于一个复杂的体系之中
②心理与教育活动受内部因素和外部因素同时影响
③心理与教育研究应在自然与社会生态环境中进行
④心理与教育研究应注重个体与所处环境之间的相互作用
⑤心理与教育研究应注重研究个体在其与环境相互作用过程中的主动性
⑥心理与教育研究应尽量兼顾真实与严格控制
（三）意义
①解决了以往的内部效度和外部效度不能同时得到保证的矛盾
②能够真实得揭示人们在教育实践、社会生活等各种活动中的心理活动规律和教育教学规律
③保证了心理及行为变化仍然是现实中各种因素综合作用的结果
④可以根据需要选择被试数量，以保证在统计上获得比较可靠的结论
⑤研究工作不受实验室条件限制，开展方便灵活` },
            { question: "课题选择的原则", answer: `（1）需要性原则
（2）创造性原则
（3）科学性原则
（4）可行性原则` },
            { question: "课题选择的策略", answer: `（1）社会需要
（2）理论发展
①为证实他人或自己的某一理论观点而选择相应课题
②根据不同理论观点之争选择课题
③通过对现有理论、观点进行质疑而提出研究课题
（3）研究文献
①注意已有研究文献忽略的一些问题
②注意发现研究结果中相互矛盾的地方
③注意已有研究在方法学方面存在的问题
④根据研究文献对现有的某些研究进行必要的重复
（4）研究过程
（5）科技进展
科学方法新进展、学科交叉的空白区、研究技术的新进展、学科分支的新进展` },
            { question: "研究假设的评价标准", answer: `（1）研究假设的提出应有一定的依据，即以一定的理论或一定的经验和观察事实为前提，因而具有一定的科学性和探讨价值，而不是毫无根据的臆测和猜想
（2）研究假设一般应对两个或两个以上的变量间的关系做出推测
（3）研究假设应以陈述句的形式清楚、毫不含糊地加以说明，而不能以问句形式或含糊不清的陈述句形式出现
（4）研究假设应当是可以检验的，即可被研究人员用以一定的方法收集的数据和事实加以验证
（5）研究假设应简单明了` },
            { question: "课题论证的意义", answer: `（1）书面形式的课题论证有助于进一步详细阐述研究课题的目的、意义、具体研究问题，明确研究将采取的具体途径和方法，指明预期成果，从而使整个研究课题的提出具体化、系统化、完善化。
（2）根据研究者的课题论证报告，有关部门、基金会、评审专家可以在一定程度上了解研究者的科学态度、学术水平和科研能力。
（3）进行课题论证、撰写课题论证报告，是进行课题评审工作、做出科研项目立项和资助决定的需要。
（4）课题论证指明了完成该研究课题所要达到的目标和研究成果的呈现方式，为今后对研究课题的进展和完成情况进行检查、鉴定提供了标准和具体指标。` },
            { question: "研究文献及类别", answer: `（1）书籍
（2）期刊
（3）学术论文与学术会议文献
（4）报纸
（5）专题文献汇编
（6）电子期刊` },
            { question: "研究文献查阅的意义", answer: `（1）有助于研究者对相关领域的情况有一个系统、全面的认识和了解
（2）有助于研究者选择研究课题，形成研究假设
（3）有助于研究者搞好研究设计
（4）有助于研究者解释研究结果、撰写研究论文` },
            { question: "研究文献搜集的原则", answer: `（1）在时间上应当从现在到过去，采用倒查法
（2）在范围、数量上应有所限制
（3）注意搜集第一手资料
（4）注意搜集得出各种各样观点、不同甚至相互矛盾结论的代表性文献
（5）注意跨学科、跨领域地搜集资料` },
            { question: "研究文献阅读的原则", answer: `（1）计划性原则
（2）顺序性原则
（3）批判性原则
（4）同时性原则` },
            { question: "文献综述的特点与作用", answer: `能全面、系统地反映国内外某一学科、某一专业或某一研究专题在某一时期的发展历史、当前状况及发展趋势。
（1）对课题研究者：为新课题确立提供逻辑论证，让研究方向明确、过程系统化条理化，避免盲目性；起到总结既往、开辟未来、提出理论和指导新课题的作用。
（2）对同领域研究者：浓缩、集中、系统化专业文献内容，节省同行阅读时间和精力；帮助同行快速了解专题的历史、进展与现存问题，助力科研定向。
（3）对跨专业研究者：突破专业局限，实现边缘交叉、触类旁通，快速了解相关领域内容。
（4）对科研管理者：为科研发展方向制定、计划规划、方针决策等提供重要参考，辅助科学决策。` },
            { question: "文献综述的基本要求", answer: `（1）搜集文献应当全面，所引用的资料和数据要真实可靠
（2）坚持材料与观点的统一
（3）综述要有针对性
（4）应提纲挈领，突出重点
（5）可适当使用统计图表来说明发展的过程和现状
（6）注意区别文献中的观点和作者的观点` },
            { question: "构思效度及其影响因素", answer: `构思效度是指理论构思的合理性及其转化为抽象与操作定义的恰当性程度。
（1）对构思缺乏明确的说明，概念解释模糊，逻辑关系不清，层次不明。
（2）单一方法和操作引起的偏差。
（3）构思水平之间的混淆
（4）研究过程中主试的期望、被试因猜想而发生的心理与行为的改变、不同实验处理之间的交互作用等。` },
            { question: "内部效度及其影响因素", answer: `内部效度是指在研究的自变量与因变量之间存在一定关系的明确程度。
（1）成熟因素
（2）历史因素
（3）被试选择上的差异
（4）研究被试缺失产生的效应
（5）前测影响
（6）实验程序不一致或处理扩散产生的效应
（7）统计回归效应
（8）多种研究条件与因素间的交互作用` },
            { question: "外部效度及其影响因素", answer: `研究的外部效度是指研究结果能够一般化和普通化到样本来自的总体和其他变量条件、时间和背景中去的程度，即研究结果的普遍代表性和适用性。
（1）研究被试的代表性差
（2）研究变量的抽象与操作定义不明确，测量方式信度、效度差，致使研究可重复性减小
（3）研究对被试的反作用
（4）事前测量与实验处理的相互影响
（5）多重处理的干扰
（6）实验者效应
（7）研究与实际情景相差较大
（8）被试选择与实验处理的交互作用` },
            { question: "研究变量的选择", answer: `（1）根据研究目的确定研究的变量，考虑研究变量的性质和特点
（2）辨明无关变量
（3）确定研究变量的数目
（4）考虑变量的测量水平` },
            { question: "研究指标设计的原则", answer: `（1）设计研究指标应以一定的理论假设为指导
（2）所设计的研究指标应当具有完整
（3）研究指标要简明、可行
（4）研究指标必须有明确的操作定义，对于定量指标还应有统一的计分或计算方法` },
            { question: "操作定义及其作用", answer: `操作定义是用可感知、可度量的事物、事件、现象和方法对变量或指标做出具体的界限、说明。
（1）有利于提高研究的客观性
（2）有利于研究假设的检验
（3）有利于提高心理与教育科学研究的统一性
（4）有利于提高研究结果的可比性` },
            { question: "无关变量的主要类别", answer: `（1）被试方面存在的无关变量
（2）主试方面存在的无关变量
（3）研究设计方面存在的无关变量
①研究方法本身不完善
②测量仪器、设备的安排、布置、调整不当
③测量工具不完善
④被试选取、研究时间和环境选取等方面存在的不足
⑤研究程序安排不当
（4）研究实施环境条件方面的无关变量
（5）数据处理方面存在的无关变量` },
            { question: "时间取样观察策略与事件取样观察策略的不同点", answer: `（1）时间取样贯彻考察的单位是时间区间，而事件取样观察考察的是行为事件本身
（2）时间取样只能研究每十五分钟至少发生一次的行为，但事件取样观察则可以研究各种各样的行为，不受行为发生频率的限制
（3）相比较而言，时间取样观察较适于专业研究者使用，而事件取样观察则适于教师使用
（4）时间取样观察研究的是事件或行为是否存在，而事件取样观察研究的是事件或行为的特征` },
            { question: "访谈问题的编制", answer: `（1）问题要清楚明确，不含糊，不模棱两可。
（2）问题的文字表述要适合访谈对象的文化程度和知识经验水平，避免咏专业术语。
（3）不要提访谈对象不能做出回答的问题
（4）对某些可能需要解释说明的问题，应制定统一的解释说明方式、说明范围、内容以及说明用词。
（5）注意使每一具体提问都集中在一个单一的变量或问题上，而不要同时涉及若干不同的问题。
（6）避免提到引导性问题，提问时的措词不能流露出自己的偏见，不要用自己的好恶影响谈话对象的态度和反应。
（7）避免使用奉承性问题，由于根据社会规范与道德，这类问题只有一个答案，因此难以获得有意义的信息。` },
            { question: "访谈法的评价", answer: `（1）优点
①可以获得更为丰富、广泛的资料，有助于对人的心理活动、教育规律进行多层次、多方面的探索
②能灵活地有针对性地开展资料收集工作
③可以保证收集到的研究资料具有较高的可靠性
④适用范围广
⑤问卷回收率和有效率高
（2）局限
①结果的准确可靠性可能受到访谈者素质的影响
②某些问题不宜进行访谈
③费时费力费财
④获得的研究资料难以量化
⑤受环境、事件和访谈对象情绪状态的限制` },
            { question: "问卷设计的原则", answer: `（1）目的性原则
（2）全面性原则
（3）计划性原则` },
            { question: "影响问卷有效率的因素", answer: `（1）问卷设计
指导语含糊不清
问卷内容有偏差
问卷复杂数量过多
（2）被试
被试的态度和能力
被试的心理状态
（3）外界作用
主试的特点，发送文件研究时环境和他人的影响` },
            { question: "定性分析的特点", answer: `（1）是建立在描述基础上的逻辑分析或判断
（2）侧重揭示心理或教育过程中的现象或行为的“意义”
（3）倾向于对研究结果进行归纳分析
（4）不仅注意对结果和产品的分析，更重视对过程和相互关系的分析` },
            { question: "变量间关系的类型", answer: `（1）正交关系
（2）相关关系
（3）因果关系` },
            { question: "判定因果关系的条件", answer: `（1）二者之间必须有可解释的相关关系
（2）二者必须有一定的时间先后顺序，“因”的变化在前，“果”的变化在后，二者顺序不能改变
（3）二者不能是虚假关系（一种关系被另一种关系取代后，原来的关系被证明不成立）
（4）因果决定的方向不能改变` },
            { question: "研究结果解释的意义", answer: `（1）通过结果的解释可以表达研究结果本身的意义及相互关系，可以对研究假设进行检验
（2）对研究结果的正确解释有助于研究成果的呈现和交流，有助于对研究进行评价
（3）有助于理论的建构与完善
（4）对研究结果的解释有助于发现研究假设之外的成果，发现新问题和新方法` }
        ];
        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        let currentCardIndex = 0;
        let remainingCards = [];
        let reviewedCount = 0;
        let totalReviews = 0;
        let isFlipped = false;
        const flashcard = document.getElementById('flashcard');
        const questionContent = document.getElementById('questionContent');
        const answerContent = document.getElementById('answerContent');
        const skipBtn = document.getElementById('skipBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressBar = document.getElementById('progressBar');
        const cardCounter = document.getElementById('cardCounter');
        const reviewedCountEl = document.getElementById('reviewedCount');
        const remainingCountEl = document.getElementById('remainingCount');
        const totalReviewsEl = document.getElementById('totalReviews');
        const completionModal = document.getElementById('completionModal');
        const finalReviewCount = document.getElementById('finalReviewCount');
        const restartBtn = document.getElementById('restartBtn');
        function init() {
            remainingCards = shuffleArray(flashcardData);
            loadCard();
            updateStats();
            flashcard.addEventListener('click', flipCard);
            skipBtn.addEventListener('click', skipCard);
            deleteBtn.addEventListener('click', deleteCard);
            shuffleBtn.addEventListener('click', shuffleCards);
            restartBtn.addEventListener('click', restart);
        }
        function loadCard() {
            if (remainingCards.length === 0) { showCompletionModal(); return; }
            currentCardIndex = 0;
            const currentCard = remainingCards[currentCardIndex];
            questionContent.textContent = currentCard.question;
            answerContent.textContent = currentCard.answer;
            flashcard.classList.remove('flipped','slide-out','delete-out');
            isFlipped = false;
            updateProgress();
            updateCounter();
        }
        function flipCard() {
            if (!isFlipped) {
                flashcard.classList.add('flipped');
                isFlipped = true;
                totalReviews++;
                updateStats();
            }
        }
        function skipCard() {
            if (remainingCards.length <= 1) { showCompletionModal(); return; }
            flashcard.classList.add('slide-out');
            setTimeout(() => {
                const first = remainingCards.shift();
                remainingCards.push(first);
                reviewedCount++;
                totalReviews++;
                flashcard.classList.remove('slide-out');
                loadCard();
                updateStats();
            }, 300);
        }
        function deleteCard() {
            flashcard.classList.add('delete-out');
            setTimeout(() => {
                remainingCards.shift();
                reviewedCount++;
                totalReviews++;
                flashcard.classList.remove('delete-out');
                loadCard();
                updateStats();
            }, 250);
        }
        function shuffleCards() {
            remainingCards = shuffleArray(remainingCards);
            loadCard();
        }
        function updateProgress() {
            const total = flashcardData.length;
            const completed = total - remainingCards.length;
            const pct = Math.round((completed / total) * 100);
            progressBar.style.width = pct + '%';
        }
        function updateCounter() {
            const total = flashcardData.length;
            const current = total - remainingCards.length + 1;
            const showCurrent = remainingCards.length === 0 ? total : Math.max(1, current);
            cardCounter.textContent = `卡片 ${showCurrent} / ${total}`;
        }
        function updateStats() {
            reviewedCountEl.textContent = reviewedCount;
            remainingCountEl.textContent = remainingCards.length;
            totalReviewsEl.textContent = totalReviews;
        }
        function showCompletionModal() {
            finalReviewCount.textContent = totalReviews;
            completionModal.classList.add('show');
        }
        function restart() {
            completionModal.classList.remove('show');
            currentCardIndex = 0;
            remainingCards = shuffleArray(flashcardData);
            reviewedCount = 0;
            totalReviews = 0;
            isFlipped = false;
            loadCard();
            updateStats();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    </body>
    </html>

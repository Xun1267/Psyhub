    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 600px; width: 100%; position: relative; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .progress { background: rgba(255,255,255,0.2); border-radius: 20px; height: 8px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: linear-gradient(90deg, #4CAF50, #81C784); height: 100%; border-radius: 20px; transition: width 0.3s ease; width: 0%; }
        .card-container { perspective: 1000px; position: relative; height: 400px; margin-bottom: 30px; }
        .flashcard {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d; transition: transform 0.6s ease, opacity 0.5s ease, scale 0.5s ease;
            cursor: pointer; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .flashcard.slide-out { transform: translateX(100%) rotateZ(15deg); opacity: 0; }
        .flashcard.delete-out { transform: scale(0); opacity: 0; }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center;
        }
        .card-front { background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%); color: #333; border: 2px solid #e9ecef; }
        .card-back { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); color: #1565c0; transform: rotateY(180deg); border: 2px solid #90caf9; }
        .card-content { font-size: 18px; line-height: 1.6; max-height: 100%; overflow-y: auto; width: 100%; }
        .card-front .card-content { font-weight: 600; font-size: 20px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .btn { padding: 12px 24px; border: none; border-radius: 25px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; min-width: 100px; }
        .btn-skip { background: linear-gradient(135deg, #ff9800, #f57c00); color: white; }
        .btn-skip:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,152,0,0.4); }
        .btn-delete { background: linear-gradient(135deg, #f44336, #d32f2f); color: white; }
        .btn-delete:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(244,67,54,0.4); }
        .btn-shuffle { background: linear-gradient(135deg, #9c27b0, #7b1fa2); color: white; }
        .btn-shuffle:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(156,39,176,0.4); }
        .stats { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; color: white; text-align: center; backdrop-filter: blur(10px); }
        .stats-item { display: inline-block; margin: 0 15px; }
        .completion-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 1000;
        }
        .completion-modal.show { opacity: 1; visibility: visible; }
        .modal-content {
            background: white; padding: 40px; border-radius: 20px; text-align: center;
            max-width: 400px; width: 90%; transform: scale(0.7); transition: transform 0.3s ease;
        }
        .completion-modal.show .modal-content { transform: scale(1); }
        .modal-title { font-size: 24px; color: #4CAF50; margin-bottom: 15px; }
        .modal-text { font-size: 16px; color: #666; margin-bottom: 25px; }
        .btn-restart { background: linear-gradient(135deg, #4CAF50, #45a049); color: white; }
        .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76,175,80,0.4); }
        .card-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #666; font-size: 14px; opacity: 0.7; }
        @media (max-width: 600px) {
            .card-container { height: 350px; }
            .card-content { font-size: 16px; }
            .card-front .card-content { font-size: 18px; }
            .controls { gap: 15px; flex-wrap: wrap; }
            .btn { padding: 10px 20px; font-size: 14px; min-width: 80px; }
        }
        .home-fab {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            border: 1.5px solid rgba(255,255,255,0.35);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            z-index: 1200;
            font-size: 22px;
        }
        .home-fab:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.22);
        }
    </style>

    <div class="container">
        <div class="header">
            <h1>咨询心理学闪卡记忆</h1>
            <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            <p id="cardCounter">载入中...</p>
        </div>
        <div class="card-container">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="card-content" id="questionContent">载入中...</div>
                    <div class="card-hint">点击卡片查看答案</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-content" id="answerContent">载入中...</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-skip" id="skipBtn">跳过</button>
            <button class="btn btn-delete" id="deleteBtn">删除</button>
            <button class="btn btn-shuffle" id="shuffleBtn">重新洗牌</button>
        </div>
        <div class="stats">
            <div class="stats-item"><strong>已复习:</strong> <span id="reviewedCount">0</span></div>
            <div class="stats-item"><strong>剩余:</strong> <span id="remainingCount">0</span></div>
            <div class="stats-item"><strong>总次数:</strong> <span id="totalReviews">0</span></div>
        </div>
    </div>
    <div class="completion-modal" id="completionModal">
        <div class="modal-content">
            <h2 class="modal-title">🎉 学习完成！</h2>
            <p class="modal-text">恭喜你完成了所有闪卡的学习！</p>
            <p class="modal-text">总复习次数: <span id="finalReviewCount">0</span></p>
            <button class="btn btn-restart" id="restartBtn">重新开始</button>
        </div>
    </div>
    <script>
        const flashcardData = [
            { question: "心理咨询师的基本态度是什么？", answer: "真诚\n共情\n积极关注" },
            { question: "正念训练所提升的三种能力是什么？", answer: "活在当下的能力\n离开头脑的能力\n如实经历的能力" },
            { question: "心理咨询的基本原则是什么？", answer: "保密原则\n助人自助原则\n价值中立原则" },
            { question: "心理不健康包括哪三种心理问题？", answer: "一般心理问题\n严重心理问题\n神经症性心理问题" },
            { question: "中国心理学会工作伦理守则（第二版）总则包含哪五个方面？", answer: "善行\n善任\n诚信\n公正\n尊重" },
            { question: "理情行为疗法 ABC 模型分别代表什么？", answer: "A（Activating Event）：诱发性事件\nB（Belief）：个体对事件的信念\nC（Consequence）：情绪和行为后果" },
            { question: "心理正常与异常的三个判断原则是什么？", answer: "主观世界与客观世界的统一性原则\n心理活动的内在协调性原则\n人格的相对稳定性原则" },
            { question: "森田疗法的核心咨询理念是什么？", answer: "顺应自然、为所当为" },
            { question: "沉默的三种类型有哪些？", answer: "创造性沉默\n自发性沉默\n冲突性沉默" },
            { question: "催眠的五个步骤是什么？", answer: "沟通\n导入\n加深\n干预\n唤醒" },
            { question: "认知三层次理论提出的三层次是什么？", answer: "自动思维\n中间信念\n核心信念" },
            { question: "苏格拉底式六问包括哪些？", answer: "有什么证据可以证明你的想法是正确的？反面的证据又有哪些？\n有没有其他方式来看待这个问题？\n最糟糕的结果会怎样？如果真的发生，你该如何应对？最好的结果会怎样？对于这个情境，最现实的结果是什么？\n相信你的自动思维会带来什么结果？如果你改变想法又会怎样？\n如果你的朋友或家人在这种情况下有同样的自动思维，你会给他什么建议？\n你可以做些什么？" },
            { question: "接纳承诺疗法中“创造性无望”的提问流程是什么？", answer: "你尝试过用什么方法来摆脱这个感受？\n这些方法的效果怎么样，暂时有效还是长期有效？\n这些方法让你付出了什么代价？\n你愿意尝试一种新的方式面对这些感受吗？" },
            { question: "一般心理问题、严重心理问题、神经症性心理问题的评估思路是什么？", answer: "第一步：排除器质性病变\n第二步：区分心理正常与异常\n第三步：区分神经症与心理不健康\n第四步：区分一般心理问题与严重心理问题" },
            { question: "标准认知行为疗法的核心定义是什么？", answer: "通过改变个人对己、对人或对事的看法与态度（认知），来改变心理问题（情绪与行为）的一种心理治疗方法。" },
            { question: "什么是正念？", answer: "正念是以一种特定的方式对自己的身心进行觉察，即有意识地觉察、活在当下及不做判断。" },
            { question: "什么是共情？", answer: "咨询师站在来访者的角度，设身处地地体验来访者的内心世界，与其感同身受，并准确地表达给来访者。" },
            { question: "什么是移情？", answer: "个体将早年对重要他人的态度、情感、冲动、欲望、行为模式无意识地重现在当前的人际关系之中。移情分为正移情和负移情。" },
            { question: "什么是阻抗？", answer: "来访者由于在意识层面和无意识层面对咨询进程的抗拒而出现的各种情况。" },
            { question: "什么是精神交互作用？", answer: "当症状发生后，患者由于自我暗示，注意力越来越集中于症状，感觉体验就会变得敏感，感觉的过敏使注意力又进一步固定于此感觉（症状），感觉与注意彼此促进、交互作用，从而产生持久症状的一种心理机制。" }
        ];
        function shuffleArray(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        let currentCardIndex = 0;
        let remainingCards = [];
        let reviewedCount = 0;
        let totalReviews = 0;
        let isFlipped = false;
        const flashcard = document.getElementById('flashcard');
        const questionContent = document.getElementById('questionContent');
        const answerContent = document.getElementById('answerContent');
        const skipBtn = document.getElementById('skipBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressBar = document.getElementById('progressBar');
        const cardCounter = document.getElementById('cardCounter');
        const reviewedCountEl = document.getElementById('reviewedCount');
        const remainingCountEl = document.getElementById('remainingCount');
        const totalReviewsEl = document.getElementById('totalReviews');
        const completionModal = document.getElementById('completionModal');
        const finalReviewCount = document.getElementById('finalReviewCount');
        const restartBtn = document.getElementById('restartBtn');
        function init() {
            remainingCards = shuffleArray(flashcardData);
            loadCard();
            updateStats();
            flashcard.addEventListener('click', flipCard);
            skipBtn.addEventListener('click', skipCard);
            deleteBtn.addEventListener('click', deleteCard);
            shuffleBtn.addEventListener('click', shuffleCards);
            restartBtn.addEventListener('click', restart);
        }
        function loadCard() {
            if (remainingCards.length === 0) { showCompletionModal(); return; }
            currentCardIndex = 0;
            const currentCard = remainingCards[currentCardIndex];
            questionContent.textContent = currentCard.question;
            answerContent.textContent = currentCard.answer;
            flashcard.classList.remove('flipped','slide-out','delete-out');
            isFlipped = false;
            updateProgress();
            updateCounter();
        }
        function flipCard() {
            if (!isFlipped) {
                flashcard.classList.add('flipped');
                isFlipped = true;
                totalReviews++;
                updateStats();
            }
        }
        function skipCard() {
            if (remainingCards.length <= 1) { showCompletionModal(); return; }
            flashcard.classList.add('slide-out');
            setTimeout(() => {
                const first = remainingCards.shift();
                remainingCards.push(first);
                reviewedCount++;
                totalReviews++;
                flashcard.classList.remove('slide-out');
                loadCard();
                updateStats();
            }, 300);
        }
        function deleteCard() {
            flashcard.classList.add('delete-out');
            setTimeout(() => {
                remainingCards.shift();
                reviewedCount++;
                totalReviews++;
                flashcard.classList.remove('delete-out');
                loadCard();
                updateStats();
            }, 250);
        }
        function shuffleCards() {
            remainingCards = shuffleArray(remainingCards);
            loadCard();
        }
        function updateProgress() {
            const total = flashcardData.length;
            const completed = total - remainingCards.length;
            const pct = Math.round((completed / total) * 100);
            progressBar.style.width = pct + '%';
        }
        function updateCounter() {
            const total = flashcardData.length;
            const current = total - remainingCards.length + 1;
            const showCurrent = remainingCards.length === 0 ? total : Math.max(1, current);
            cardCounter.textContent = `卡片 ${showCurrent} / ${total}`;
        }
        function updateStats() {
            reviewedCountEl.textContent = reviewedCount;
            remainingCountEl.textContent = remainingCards.length;
            totalReviewsEl.textContent = totalReviews;
        }
        function showCompletionModal() {
            finalReviewCount.textContent = totalReviews;
            completionModal.classList.add('show');
        }
        function restart() {
            completionModal.classList.remove('show');
            currentCardIndex = 0;
            remainingCards = shuffleArray(flashcardData);
            reviewedCount = 0;
            totalReviews = 0;
            isFlipped = false;
            loadCard();
            updateStats();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>

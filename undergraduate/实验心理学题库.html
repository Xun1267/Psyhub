<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验心理学习题库 (完整版 1-388)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* * 核心样式系统 - 玻璃拟态与莫兰迪色系 */
        :root {
            --morandi-blue: #93a2a9;
            --morandi-blue-light: #cdd5d8;
            --morandi-green: #9caf98;
            --morandi-green-light: #dbe4d9;
            --morandi-pink: #dcc7c4;
            --text-main: #4a4a4a;
            --text-light: #6e6e6e;
            --success-color: #7b9e89;
            --error-color: #c98a86;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0e8eb 0%, #b5c4b1 50%, #dcc7c4 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            line-height: 1.6;
            background-attachment: fixed;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        /* Glassmorphism Components */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.3s ease;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            color: var(--text-main);
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .glass-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .glass-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .glass-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(200, 200, 200, 0.2);
        }

        .back-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        /* Header */
        header h1 {
            font-family: 'Noto Serif SC', serif;
            color: var(--text-main);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            text-align: center;
        }

        .progress-container {
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .progress-fill {
            height: 100%;
            background: var(--morandi-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Tags */
        .chapter-tag, .type-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            margin-right: 8px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
        }

        .chapter-tag {
            background: rgba(147, 162, 169, 0.15);
            color: var(--text-main);
        }

        .type-tag.single {
            background: rgba(156, 175, 152, 0.2);
            color: #5a7058;
        }

        .type-tag.multi {
            background: rgba(220, 199, 196, 0.3);
            color: #8a6a66;
        }

        /* Question Area */
        .question-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: flex-start;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.7);
        }

        .option-item.selected {
            background: var(--morandi-blue-light);
            border-color: var(--morandi-blue);
        }

        .question-card.multi .option-item.selected {
            background: var(--morandi-pink);
            border-color: #bfa5a1;
        }

        .option-item.correct {
            background: rgba(123, 158, 137, 0.2) !important;
            border-color: var(--success-color) !important;
        }

        .option-item.wrong {
            background: rgba(201, 138, 134, 0.2) !important;
            border-color: var(--error-color) !important;
        }

        .option-marker {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            margin-right: 16px;
            border: 2px solid #a0a0a0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #888;
            margin-top: 2px;
        }

        .question-card.multi .option-marker {
            border-radius: 6px;
        }

        .option-item.selected .option-marker {
            border-color: var(--text-main);
            color: var(--text-main);
            background: rgba(255,255,255,0.5);
        }

        .option-item.correct .option-marker {
            border-color: var(--success-color);
            background: var(--success-color);
            color: white;
            content: '✓';
        }

        .option-item.wrong .option-marker {
            border-color: var(--error-color);
            background: var(--error-color);
            color: white;
            content: '✕';
        }

        .feedback-section {
            margin-top: 24px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            border-left: 4px solid var(--morandi-blue);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .feedback-section.show {
            display: block;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
            font-family: 'Noto Serif SC', serif;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .question-navigator {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 10px;
            flex: 1;
            margin: 0 15px;
            scrollbar-width: none;
        }
        .question-navigator::-webkit-scrollbar { display: none; }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background: rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .nav-dot.active {
            width: 24px;
            background: var(--morandi-blue);
        }

        .nav-dot.correct {
            background: var(--success-color);
            opacity: 0.8;
        }

        .nav-dot.wrong {
            background: var(--error-color);
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--morandi-blue), #7a8b92);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 2.5rem;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(147, 162, 169, 0.4);
            font-family: 'Noto Serif SC', serif;
        }

        .score-label {
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.9;
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 600px) {
            .back-home-btn {
                position: static;
                margin-bottom: 20px;
                display: inline-block;
            }
            .bottom-nav {
                width: 95%;
                bottom: 10px;
            }
        }
    </style>

<script>
    // 题目数据整合 (1-200)
    const questions = [
        { id: 1, chapter: "抽样方法", type: "single", question: "“目标总体”最准确的定义是：", options: ["A. 研究对象中方便抽取的总体", "B. 研究对象的全体", "C. 研究者能实际调查的总体", "D. 抽样后剩余的总体"], answer: -1, analysis: "" },
        { id: 2, chapter: "抽样方法", type: "single", question: "“可得总体”指的是：", options: ["A. 研究对象的全体", "B. 研究对象中方便抽取的总体", "C. 与研究无关的总体", "D. 采用分层抽样后的总体"], answer: -1, analysis: "" },
        { id: 3, chapter: "抽样方法", type: "single", question: "“代表性样本”应满足的要求是：", options: ["A. 与可得总体保持一致", "B. 与目标总体保持一致", "C. 任意选择，只要数量足够即可", "D. 研究者主观判断即可"], answer: -1, analysis: "" },
        { id: 4, chapter: "抽样方法", type: "single", question: "下列哪项属于“有偏样本”的特征？", options: ["A. 样本特征与总体研究特征高度一致", "B. 样本特征与总体研究特征差异甚远", "C. 抽样方法随机，机会均等", "D. 样本容量很大"], answer: -1, analysis: "" },
        { id: 5, chapter: "抽样方法", type: "single", question: "“简单随机抽样”最重要的特点是：", options: ["A. 每个个体被选中的机会相同", "B. 按总体特征分层后再抽样", "C. 按群组随机选择部分群组", "D. 根据方便程度选择"], answer: -1, analysis: "" },
        { id: 6, chapter: "抽样方法", type: "single", question: "“分层随机抽样”适用于以下哪种情况？", options: ["A. 总体内各单位特征完全相同", "B. 总体内存在明显异质性，需要分层", "C. 无法获取总体特征信息", "D. 只需便捷地获取样本"], answer: -1, analysis: "" },
        { id: 7, chapter: "抽样方法", type: "single", question: "“整群抽样”是指：", options: ["A. 把总体分层后，各层内随机抽样", "B. 随机选取若干完整的群组进行调查", "C. 从总体中随机抽取若干个体", "D. 根据便利程度选择群组"], answer: -1, analysis: "" },
        { id: 8, chapter: "抽样方法", type: "single", question: "下列哪种方法最缺乏随机性且代表性最差？", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 整群抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 9, chapter: "抽样方法", type: "single", question: "要保证样本具有最佳代表性，应首选：", options: ["A. 便利取样", "B. 整群抽样", "C. 简单随机抽样", "D. 有偏样本"], answer: -1, analysis: "" },
        { id: 10, chapter: "抽样方法", type: "single", question: "下列哪项不属于概率抽样方法？", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 整群抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 11, chapter: "抽样方法", type: "single", question: "关于“可得总体”的描述，以下哪项错误？", options: ["A. 是研究对象中可方便抽取的那部分", "B. 必定能够完全代表目标总体", "C. 与目标总体有一定差异风险", "D. 往往受实际条件限制"], answer: -1, analysis: "" },
        { id: 12, chapter: "抽样方法", type: "single", question: "以下哪种情形属于“有偏样本”？", options: ["A. 按性别、年龄分层后抽取", "B. 从全国随机抽取各地居民", "C. 网络问卷仅收集团队成员回答", "D. 按群组随机选取若干小区"], answer: -1, analysis: "" },
        { id: 13, chapter: "抽样方法", type: "single", question: "如果总体具有明显的地域／行业差异，研究者应采用：", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 便利取样", "D. 有偏样本"], answer: -1, analysis: "" },
        { id: 14, chapter: "抽样方法", type: "single", question: "当总体难以分层且地域分布广时，常用：", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 整群抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 15, chapter: "抽样方法", type: "single", question: "研究者选择门诊时间内首10位来访患者，属于：", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 整群抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 16, chapter: "抽样方法", type: "single", question: "在分层随机抽样中，常用的分层依据不包括：", options: ["A. 性别", "B. 年龄", "C. 星座", "D. 区域"], answer: -1, analysis: "" },
        { id: 17, chapter: "抽样方法", type: "single", question: "当群组数量较少且组内差异大时，优先考虑：", options: ["A. 简单随机抽样", "B. 分层随机抽样", "C. 整群抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 18, chapter: "抽样方法", type: "single", question: "下列哪项能有效降低抽样误差？", options: ["A. 缩小样本容量", "B. 增加样本容量", "C. 使用便利取样", "D. 使用有偏样本"], answer: -1, analysis: "" },
        { id: 19, chapter: "抽样方法", type: "single", question: "若要确保每位研究对象被选中的机会相等，应采用：", options: ["A. 分层随机抽样", "B. 整群抽样", "C. 简单随机抽样", "D. 便利取样"], answer: -1, analysis: "" },
        { id: 20, chapter: "抽样方法", type: "single", question: "在整群抽样中，错误的做法是：", options: ["A. 把总体划分为若干互不重叠的群组", "B. 随机选取部分群组进行全面调查", "C. 先从每个群组中随机抽取个体再调查", "D. 对所选群组中的每个单位全部调查"], answer: -1, analysis: "" },
        { id: 21, chapter: "抽样方法", type: "single", question: "研究者只能获得A市三家医院的患者名单，则这三家医院构成：", options: ["A. 目标总体", "B. 可得总体", "C. 代表性样本", "D. 有偏样本"], answer: -1, analysis: "" },

    ];

    // 状态管理
    let currentQuestionIndex = 0;
    const userAnswers = new Array(questions.length).fill(null);

    // 初始化 DOM
    const quizArea = document.getElementById('quiz-area');
    const navDotsContainer = document.getElementById('nav-dots');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function init() {
        QuizSafety.showStatus(quizArea, questions);
        document.getElementById('total-count').textContent = questions.length;
        renderQuestions();
        renderNavDots();
        updateUI();
    }

    function renderQuestions() {
        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = `glass-card question-card ${q.type} ${index === 0 ? 'active' : ''}`;
            card.id = `q-card-${index}`;

            const typeLabel = q.type === 'multi' ? '多选题' : '单选题';
            const typeClass = q.type;

            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                let marker = String.fromCharCode(65 + optIndex);
                let text = opt.replace(/^[A-Z]\.\s*/, '');

                optionsHtml += `
                    <div class="option-item" onclick="handleOptionClick(${index}, ${optIndex})" id="opt-${index}-${optIndex}">
                        <div class="option-marker">${marker}</div>
                        <div class="option-content">${text}</div>
                    </div>
                `;
            });

            const actionHtml = !QuizSafety.hasAnswer(q) ? QuizSafety.pendingAction(q) : `
                <button class="glass-button" id="submit-btn-${index}" onclick="submitAnswer(${index})" style="width:100%; margin-top:15px; color: white; background: var(--morandi-blue);">
                    确认答案
                </button>
            `;

            card.innerHTML = `
                <div style="margin-bottom:15px;">
                    <span class="chapter-tag">${q.chapter}</span>
                    <span class="type-tag ${typeClass}">${typeLabel}</span>
                </div>
                <div class="question-text">${q.id}. ${q.question}</div>
                <div class="options-list">${optionsHtml}</div>
                ${actionHtml}
                <div class="feedback-section" id="feedback-${index}">
                    <div class="feedback-title">解析</div>
                    <div style="font-size: 0.95rem; color: var(--text-main);">${q.analysis}</div>
                </div>
            `;
            quizArea.appendChild(card);
        });
    }

    function renderNavDots() {
        questions.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `nav-dot ${index === 0 ? 'active' : ''}`;
            dot.id = `nav-dot-${index}`;
            dot.onclick = () => jumpToQuestion(index);
            navDotsContainer.appendChild(dot);
        });
    }

    window.handleOptionClick = function(qIndex, optIndex) {
        const btn = document.getElementById(`submit-btn-${qIndex}`);
        if (!btn || btn.disabled) return;

        const q = questions[qIndex];
        const optEl = document.getElementById(`opt-${qIndex}-${optIndex}`);

        if (q.type === 'single') {
            const allOpts = document.querySelectorAll(`#q-card-${qIndex} .option-item`);
            allOpts.forEach(el => el.classList.remove('selected'));
            optEl.classList.add('selected');
        } else {
            optEl.classList.toggle('selected');
        }
    };

    window.submitAnswer = function(qIndex) {
        const q = questions[qIndex];
        if (!QuizSafety.hasAnswer(q) || userAnswers[qIndex] !== null) return;
        const card = document.getElementById(`q-card-${qIndex}`);
        const selectedEls = card.querySelectorAll('.option-item.selected');

        if (selectedEls.length === 0) {
            alert('请先选择答案');
            return;
        }

        const btn = document.getElementById(`submit-btn-${qIndex}`);
        btn.disabled = true;
        btn.textContent = '已作答';
        btn.style.opacity = '0.6';
        btn.style.cursor = 'default';

        let userAns;
        const selectedIndices = Array.from(selectedEls).map(el => {
            const idParts = el.id.split('-');
            return parseInt(idParts[2]);
        });

        if (q.type === 'single') {
            userAns = selectedIndices[0];
        } else {
            userAns = selectedIndices.sort((a, b) => a - b);
        }

        userAnswers[qIndex] = userAns;

        let isCorrect = false;
        if (q.type === 'single') {
            isCorrect = (userAns === q.answer);
        } else {
            isCorrect = JSON.stringify(userAns) === JSON.stringify(q.answer.sort((a,b)=>a-b));
        }

        const feedback = document.getElementById(`feedback-${qIndex}`);
        const navDot = document.getElementById(`nav-dot-${qIndex}`);

        feedback.classList.add('show');
        feedback.style.borderLeftColor = isCorrect ? 'var(--success-color)' : 'var(--error-color)';

        const allOpts = card.querySelectorAll('.option-item');
        const correctIndices = Array.isArray(q.answer) ? q.answer : [q.answer];

        correctIndices.forEach(idx => {
            allOpts[idx].classList.add('correct');
        });

        selectedIndices.forEach(idx => {
            if (!correctIndices.includes(idx)) {
                allOpts[idx].classList.add('wrong');
            }
        });

        navDot.classList.add(isCorrect ? 'correct' : 'wrong');

        setTimeout(() => {
            feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);

        updateStats();
    };

    window.jumpToQuestion = function(index) {
        document.getElementById(`q-card-${currentQuestionIndex}`).classList.remove('active');
        document.getElementById(`nav-dot-${currentQuestionIndex}`).classList.remove('active');

        currentQuestionIndex = index;

        document.getElementById(`q-card-${currentQuestionIndex}`).classList.add('active');
        document.getElementById(`nav-dot-${currentQuestionIndex}`).classList.add('active');

        updateUI();
    };

    window.nextQuestion = function() {
        if (currentQuestionIndex < questions.length - 1) {
            jumpToQuestion(currentQuestionIndex + 1);
        } else {
            showResults();
        }
    };

    window.prevQuestion = function() {
        if (currentQuestionIndex > 0) {
            jumpToQuestion(currentQuestionIndex - 1);
        }
    };

    window.resetQuiz = function() {
        if(confirm('确定要重新开始练习吗？所有进度将重置。')) {
            location.reload();
        }
    };

    function updateUI() {
        document.getElementById('current-index').textContent = currentQuestionIndex + 1;

        const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
        document.getElementById('progress-fill').style.width = `${progress}%`;

        prevBtn.disabled = currentQuestionIndex === 0;
        if (currentQuestionIndex === questions.length - 1) {
            nextBtn.textContent = '查看结果';
        } else {
            nextBtn.textContent = '❯';
        }

        document.getElementById('result-area').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';
    }

    function updateStats() {
        const answered = userAnswers.filter(a => a !== null).length;
        if (answered === 0) return;

        let correctCount = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === null) return;
            const q = questions[idx];
            let isC = false;
            if (q.type === 'single') isC = (ans === q.answer);
            else isC = JSON.stringify(ans) === JSON.stringify(q.answer.sort((a,b)=>a-b));
            if (isC) correctCount++;
        });

        const acc = Math.round((correctCount / answered) * 100);
        document.getElementById('current-accuracy').textContent = `${acc}%`;
    }

    function showResults() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';

        let score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === null) return;
            const q = questions[idx];
            let isC = false;
            if (q.type === 'single') isC = (ans === q.answer);
            else isC = JSON.stringify(ans) === JSON.stringify(q.answer.sort((a,b)=>a-b));
            if (isC) score++;
        });

        document.getElementById('final-score').textContent = score;

        const total = questions.filter(q => QuizSafety.hasAnswer(q)).length;
        const acc = (total ? Math.round((score / total) * 100) : 0);

        let comment = "继续加油！";
        if (acc > 90) comment = "太棒了！掌握得非常好！";
        else if (acc > 60) comment = "基础不错，注意查漏补缺。";

        document.getElementById('accuracy-text').innerHTML = `
            可评分 ${total} 题（待核对 ${questions.length - total} 题），答对 <span style="color:var(--success-color);font-weight:bold;">${score}</span> 题<br>
            正确率：${acc}%<br>
            ${comment}
        `;
    }

    async function loadOriginalAnswers() {
        try {
            const response = await fetch('实验心理学题目答案解析.md');
            if (!response.ok) throw new Error('答案资料加载失败');
            const lines = (await response.text()).split(/\r?\n/);
            const answerStart = lines.findIndex(line => line.trim() === '答案');
            if (answerStart < 0) throw new Error('未找到答案段落');
            const sourceQuestions = new Map();
            for (const line of lines.slice(0, answerStart)) {
                const match = line.trim().match(/^(\d+)[.、]\s*(.+)/);
                if (match) sourceQuestions.set(Number(match[1]), match[2]);
            }
            const answers = new Map();
            for (const line of lines.slice(answerStart + 1)) {
                const match = line.trim().match(/^(\d+)[.、]\s*([A-D])(?:\s*)(.*)$/);
                if (!match) continue;
                const id = Number(match[1]);
                const entry = {answer: match[2].charCodeAt(0) - 65, analysis: match[3]};
                if (answers.has(id)) entry.conflict = true;
                answers.set(id, entry);
            }
            const normalize = value => value.replace(/\s+/g, '');
            for (const question of questions) {
                const entry = answers.get(question.id);
                if (!entry) continue;
                if (normalize(sourceQuestions.get(question.id) || '') !== normalize(question.question)) {
                    question.reviewReason = '题干与答案资料中的题目不一致';
                    continue;
                }
                if (entry.conflict || /部分正确/.test(entry.analysis)) {
                    question.reviewReason = '原资料答案存在歧义';
                    continue;
                }
                question.answer = entry.answer;
                question.analysis = QuizSafety.escape(entry.analysis || '原资料未提供详细解析');
            }
        } catch (error) {
            questions.forEach(question => { question.reviewReason = '答案资料暂时无法加载，请刷新后重试'; });
        }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        await loadOriginalAnswers();
        const tc = document.getElementById('total-count');
        if (tc) tc.textContent = String(questions.length);
        const h1 = document.querySelector('header h1');
        if (h1) h1.textContent = '实验心理学习题 (1-388)';
        init();
    });

</script>
